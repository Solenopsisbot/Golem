# Eval fleet: a second agent on its own ports so evals can run while the main fleet plays.
[fleet]
name = "eval"
data_dir = "./data"
mcp_bind = "127.0.0.1:8771"

[clef]
launcher = "../MezzoSopranoClef/launcher/build/libs/mezzosopranoclef-launcher-0.1.0.jar"
server = "127.0.0.1:25566"
auth = "offline"
base_port = 9741
max_heap = "1024m"

[players]
owners = ["owner"]            # the eval runner sends goals as this player

[[agents]]
name = "Tester"
persona = "personas/clay.md"

# Eval-only model routing. The default fleet routes planning turns to Fable; when that model's
# usage limit is exhausted every planning turn errors out and a long rung degrades into act-only
# turns. Evals need to be reproducible more than they need the cheaper planner, so they plan on
# opus too. The live fleet's routing (golem.toml) is unaffected.
[mind.models.plan]
model = "opus"
effort = "high"

# dragon_fight is ON for this measurement, which is a deliberate change from "the agent decides".
#
# Four full runs with it off ended the same way: 10 crystals standing, dragon at 200, and deaths in
# double figures. The reason is structural rather than a failure of judgement. A planning turn takes
# 50 to 950 seconds; the dragon kills an armoured bot in two hits; and with dragon_fight off the only
# always-on behaviour in a boss fight is self_preservation, which exclusively runs away. The agent
# reasons well - it correctly diagnosed that a 45-block diagonal bow shot falls short and switched to
# firing straight up from the pillar foot - but it never lives long enough to run what it writes.
#
# So this is an experiment to isolate one variable, not a settled default. Whether a shipped reflex
# belongs in default_on for a boss rung, or whether the agent should have to reach for it itself, is
# a judgement call about how much the mind is meant to do - and that call is Viola's, not this file's.
[reflexes]
default_on = ["auto_respawn", "bunker", "self_preservation", "unstuck", "auto_eat", "item_collecting", "idle_staring", "dragon_fight"]
