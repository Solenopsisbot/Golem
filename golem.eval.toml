# Eval fleet: a second agent on its own ports so evals can run while the main fleet plays.
[fleet]
name = "eval"
data_dir = "./data"
mcp_bind = "127.0.0.1:8771"

[clef]
launcher = "../MezzoSopranoClef/launcher/build/libs/mezzosopranoclef-launcher-0.1.0.jar"
server = "127.0.0.1:25566"
auth = "offline"
base_port = 9741
max_heap = "1024m"

[players]
owners = ["owner"]            # the eval runner sends goals as this player

[[agents]]
name = "Tester"
persona = "personas/clay.md"

# Plan on Fable, act on Opus.
#
# The endgame rungs are turn-starved, not thinking-starved. The last two-hour dragon run managed 22
# turns: one planning turn alone ran 562 seconds and produced three tool calls, and the bot stood
# still for most of an hour while the clock ran out with four crystals up. Planning on opus at high
# effort buys deliberation the fight does not reward - the decisions here are "which crystal next"
# and "is it perched", not subtle ones - and spends the budget that should be going into acting.
#
# Fable is the cheaper, faster planner. If its usage limit is exhausted every planning turn errors
# out and the rung degrades to act-only, so watch for that in the log rather than wondering why it
# has gone quiet.
[mind.models.plan]
model = "fable"
effort = "medium"

# Stock reflexes only. dragon_fight exists and is documented in the library index, but switching it
# on is the agent's decision to make (reflex_set), not the fixture's to make for it.
#
# It was briefly defaulted on to isolate one variable, and the measurement was worth having: with it
# off, four runs cleared zero crystals; with it on, one crystal fell in twenty seconds. But the agent
# then turned it off itself in every run where it was enabled - once while it was actively winning -
# because a reflex cancels the mind's scripts and has no way to report that it is making progress.
# That is a design problem in the arbitration, not a reason to take the choice away from the agent.
#
# The rung passes with it off: run 43 killed the dragon in 858s with 0 deaths.
[reflexes]
default_on = ["auto_respawn", "bunker", "self_preservation", "unstuck", "auto_eat", "item_collecting", "idle_staring"]
