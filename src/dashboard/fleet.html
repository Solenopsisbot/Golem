<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Golem</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/dashboard/style.css">
<style>
  .wrap { grid-template-rows: auto minmax(0, 1fr); height: calc(100vh - 47px); }
  .two { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(360px, 1fr); gap: var(--gap); min-height: 0; }
  #feedwrap { position: relative; }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark"></span>Golem <small id="fleetname"></small></div>
  <span class="crumb" id="count"></span>
  <span class="spacer"></span>
  <span class="live" id="live"><span class="dot"></span><span id="livetxt">connecting</span></span>
  <span class="clock" id="clock"></span>
  <button class="btn danger" id="metall" title="Stop every golem: cancel runs, clear movement, stop the minds' turns">met all</button>
</header>
<div class="wrap">
  <div class="cards" id="cards"></div>
  <div class="two">
    <section class="panel" id="feedwrap">
      <div class="hd">Timeline <span class="sp"></span><span class="chips" id="filters">
        <button class="chip on" data-f="said">chat</button><button class="chip on" data-f="bus">bus</button><button class="chip on" data-f="turn">turns</button><button class="chip on" data-f="reflex">reflexes</button><button class="chip" data-f="tool">tools</button><button class="chip" data-f="inbox">inbox</button>
      </span></div>
      <div class="bd scroll feed" id="feed"><div class="empty">waiting for the fleet…</div></div>
      <button class="btn sm jump hidden" id="jump">↓ latest</button>
      <div class="hintline">As an owner, <code>goal …</code>, <code>met</code>, <code>status</code> and <code>come</code> are fast paths: no turn, no cost.</div>
      <form class="composer" id="composer"><select id="target"><option value="*">everyone</option></select><input id="text" placeholder="say something to the golems…" autocomplete="off"><button class="btn primary">send</button></form>
    </section>
    <section class="panel">
      <div class="hd"><span class="tabs" id="tabs"><button class="on" data-f="tasks">tasks</button><button data-f="places">places</button><button data-f="chests">chests</button></span><span class="sp"></span><input class="search" id="search" placeholder="filter…"><button class="btn sm ghost" id="reload">reload</button></div>
      <div class="bd scroll md" id="md"><div class="empty">…</div></div>
    </section>
  </div>
</div>
<script type="module">
import { auth, api, stream, toast, md, pinned, esc, hhmm, short, hpClass, phaseTag } from "/dashboard/common.js";
const A = await auth(); const X = api(A);
document.getElementById("fleetname").textContent = A.cfg.fleet && A.cfg.fleet !== "golem" ? A.cfg.fleet : "";
const feed = document.getElementById("feed"); const pin = pinned(feed, document.getElementById("jump"));
const last = {}; let shared = { tasks: "", places: "", chests: "" }; let tab = "tasks"; let rows = [];
const filters = new Set(["said", "bus", "turn", "reflex"]);
setInterval(() => document.getElementById("clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }), 1000);

function card(a) {
  const l = last[a.name] || {};
  const hp = Number(a.hp ?? 0), food = Number(a.food ?? 0);
  return `<div class="card ${a.dead ? "dead" : ""}" data-agent="${esc(a.name)}">
    <div class="name"><b>${esc(a.name)}</b><span class="where">${a.inWorld ? esc(a.pos) + " · " + esc(a.dimension) : "not in world"}</span><span class="sp"></span>
      ${a.dead ? '<span class="tag dead">dead</span>' : ""}${a.reflex ? `<span class="tag reflex">${esc(a.reflex)}</span>` : ""}${phaseTag(a.phase, a.weather)}</div>
    <div class="bars"><span class="k">health</span><span class="bar hp ${hpClass(hp)}"><i style="width:${Math.max(0, Math.min(100, hp / 20 * 100))}%"></i></span><span class="v">${hp.toFixed(0)}/20</span>
      <span class="k">food</span><span class="bar food"><i style="width:${Math.max(0, Math.min(100, food / 20 * 100))}%"></i></span><span class="v">${food}/20</span></div>
    <div class="kv"><span class="k">holding</span><span class="v">${esc(a.held || "nothing")}</span>
      <span class="k">doing</span><span class="v">${esc(a.doing || (a.pathing ? "walking" : "idle"))}</span>
      ${l.turn ? `<span class="k">last turn</span><span class="v">${esc(l.turn)}</span>` : ""}</div>
    ${l.say ? `<div class="said"><span class="t">${hhmm(l.sayT)}</span>${esc(l.say)}</div>` : ""}
    ${a.goal ? `<details><summary class="goal"><b>goal</b> ${esc(short(a.goal, 90))}</summary><div class="goal">${esc(a.goal)}</div></details>` : `<div class="goal faint">no goal</div>`}
    <div class="foot"><a class="btn sm" href="${a.dash}">open ${esc(a.name)} ↗</a><span class="sp"></span><button class="btn sm danger" data-met="${esc(a.name)}">met</button></div>
  </div>`;
}
function render(agents) {
  rows = agents;
  document.getElementById("cards").innerHTML = agents.map(card).join("") || `<div class="empty">no agents registered</div>`;
  document.getElementById("count").textContent = `${agents.length} golem${agents.length === 1 ? "" : "s"}`;
  const sel = document.getElementById("target"); const cur = sel.value;
  sel.innerHTML = `<option value="*">everyone</option>` + agents.map((a) => `<option value="${esc(a.name)}">${esc(a.name)}</option>`).join("");
  if ([...sel.options].some((o) => o.value === cur)) sel.value = cur;
  document.querySelectorAll("[data-met]").forEach((b) => b.onclick = async () => { await X.post(`/agents/${encodeURIComponent(b.dataset.met)}/met`); toast(`${b.dataset.met}: met`); });
}
function add(cls, who, html, t = Date.now(), pill = cls) {
  if (feed.firstElementChild?.classList.contains("empty")) feed.innerHTML = "";
  const d = document.createElement("div"); d.className = `row ${cls}`; d.dataset.f = cls === "dm" ? "bus" : cls === "death" ? "reflex" : cls;
  d.classList.toggle("hidden", !filters.has(d.dataset.f));
  d.innerHTML = `<span class="t">${hhmm(t)}</span><span class="who">${esc(who)}</span><span class="txt"><span class="pill">${esc(pill)}</span>${html}</span>`;
  feed.appendChild(d); while (feed.children.length > 500) feed.removeChild(feed.firstChild); pin.after();
}
const H = {
  hello: (d) => render(d.agents),
  state: (d) => render(d.agents),
  bus: (d) => add("bus", `${d.from} → ${d.to}`, esc(d.text), d.t),
  said: (d) => { last[d.agent] = { ...(last[d.agent] || {}), say: d.text, sayT: d.t }; add("said", d.agent, esc(d.text), d.t, "said"); render(rows); },
  dm: (d) => {},
  turn_end: (d) => { last[d.agent] = { ...(last[d.agent] || {}), turn: `${d.stopReason} · ${Math.round(d.ms / 1000)}s · ${d.toolCalls ?? 0} calls${d.model ? " · " + short(d.model, 26) : ""}` }; add("turn", d.agent, `turn ${esc(d.stopReason)} · ${Math.round(d.ms / 1000)}s · ${d.toolCalls ?? 0} calls${d.model ? " · " + esc(d.model) : ""}`, d.t); },
  reflex: (d) => add("reflex", d.agent, `${esc(d.name)}${d.note ? ": " + esc(d.note) : ""}`, d.t),
  golem_tool: (d) => { if (d.name === "say" || d.name === "dm") return; add(`tool${d.isError ? " err" : ""}`, d.agent, `${esc(d.name)}(${esc(short(JSON.stringify(d.args), 80))}) → ${esc(short(String(d.result).split("\n")[0], 100))}`, d.t, "tool"); },
  inbox: (d) => { const it = d.item || d; if (!it.kind || it.kind === "goal_tick") return; add("inbox", d.agent, `${esc(it.kind)}${it.from ? " · " + esc(it.from) : ""}: ${esc(short(it.text, 160))}`, d.t); },
};
document.querySelectorAll("#filters .chip").forEach((c) => c.onclick = () => { c.classList.toggle("on"); const f = c.dataset.f; c.classList.contains("on") ? filters.add(f) : filters.delete(f); feed.querySelectorAll(".row").forEach((r) => r.classList.toggle("hidden", !filters.has(r.dataset.f))); pin.after(); });
document.querySelectorAll("#tabs button").forEach((b) => b.onclick = () => { document.querySelectorAll("#tabs button").forEach((x) => x.classList.remove("on")); b.classList.add("on"); tab = b.dataset.f; renderMd(); });
document.getElementById("search").oninput = renderMd;
document.getElementById("reload").onclick = loadShared;
function renderMd() { document.getElementById("md").innerHTML = md(shared[tab], document.getElementById("search").value.trim()); }
async function loadShared() { try { shared = await X.get("/fleet/shared"); renderMd(); } catch (e) { document.getElementById("md").innerHTML = `<div class="empty">${esc(e.message)}</div>`; } }
document.getElementById("composer").onsubmit = async (e) => {
  e.preventDefault(); const el = document.getElementById("text"); const text = el.value.trim(); if (!text) return; el.value = "";
  const to = document.getElementById("target").value;
  const r = to === "*" ? await X.post("/fleet/inbox", { text }) : await X.post(`/agents/${encodeURIComponent(to)}/inbox`, { text });
  const fast = r.id === -1 || (r.ids && Object.values(r.ids).every((i) => i === -1));
  toast(fast ? `fast path: ${short(text, 40)}` : `sent to ${to === "*" ? "everyone" : to}`);
  add("inbox", "you", `→ ${esc(to === "*" ? "everyone" : to)}: ${esc(text)}`, Date.now(), "you");
};
document.getElementById("metall").onclick = async () => { for (const a of rows) await X.post(`/agents/${encodeURIComponent(a.name)}/met`); toast("met: everyone stopped"); };
try {
  const s = await X.get("/fleet/status"); render(s.agents);
  for (const m of await X.get("/fleet/bus")) add("bus", `${m.from} → ${m.to}`, esc(m.text), m.t);
  await loadShared();
} catch (e) { document.getElementById("cards").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
stream(A.withToken("/fleet/events"), H, (st) => { const el = document.getElementById("live"); el.className = `live ${st}`; document.getElementById("livetxt").textContent = st === "on" ? "live" : "reconnecting…"; });
setInterval(loadShared, 30000);
</script>
</body>
</html>
