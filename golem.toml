# Golem dev fleet. See docs/CONFIG.md for every key.

[fleet]
name = "dev"
data_dir = "./data"
mcp_bind = "127.0.0.1:8770"

[clef]
launcher = "../MezzoSopranoClef/launcher/build/libs/mezzosopranoclef-launcher-0.1.0.jar"
server = "127.0.0.1:25566"      # scripts/dev-server.sh (off 25565 so Clef's own e2e can have it)
auth = "offline"
base_port = 9731                 # agent N gets base_port + N (far from 8731+, which Clef's verify scripts use)
max_heap = "1024m"

[players]
owners = ["Solenopsisbot"]

[chat]
listen = "addressed"
speech = "explicit"

[reflexes]
default_on = ["auto_respawn", "bunker", "self_preservation", "unstuck", "auto_eat", "item_collecting", "idle_staring"]

[[agents]]
name = "Clay"
persona = "personas/clay.md"
body.attach = "100.83.136.37:9731"   # body runs on cytonic, over Tailscale (its LAN address is firewalled) (systemd --user golem-body-Clay); drop this line to run it locally

[[agents]]
name = "Flint"
persona = "personas/flint.md"
body.attach = "100.83.136.37:9732"   # body runs on cytonic, over Tailscale (its LAN address is firewalled) (systemd --user golem-body-Flint); drop this line to run it locally
reflexes.on = ["auto_respawn", "bunker", "self_preservation", "self_defense", "unstuck", "auto_eat", "item_collecting"]

[comms]
agents = "both"   # bus + public chat mirror so players can watch the golems talk
